<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>在线词典</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            max-width: 850px; 
            margin: 40px auto; 
            padding: 20px; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .container { 
            background: white; 
            padding: 35px; 
            border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        h1 { 
            color: #2c3e50; 
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .badge { 
            display: inline-block; 
            background: linear-gradient(135deg, #007bff, #00bcd4); 
            color: white; 
            padding: 2px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: normal;
        }
        .badge-green {
            background: linear-gradient(135deg, #28a745, #20c997);
        }
        .search-box {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        input { 
            flex: 1;
            padding: 14px 18px; 
            font-size: 16px; 
            border: 2px solid #e0e0e0; 
            border-radius: 10px;
            transition: all 0.3s;
        }
        input:focus { 
            outline: none; 
            border-color: #007bff; 
            box-shadow: 0 0 0 3px rgba(0,123,255,0.2);
        }
        button { 
            padding: 14px 32px; 
            font-size: 16px; 
            cursor: pointer; 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
            border: none; 
            border-radius: 10px;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,123,255,0.4);
        }
        #result { 
            margin-top: 25px; 
            border-top: 2px solid #f0f0f0; 
            padding-top: 25px; 
        }
        .word-title { 
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 3px solid #007bff;
            padding-bottom: 12px;
        }
        .word-title h2 {
            margin: 0;
            font-size: 38px;
            color: #2c3e50;
        }
        .word-title .phonetic {
            color: #666;
            font-size: 20px;
        }
        .audio-btn { 
            background: linear-gradient(135deg, #28a745, #1e7e34); 
            color: white; 
            border: none; 
            padding: 10px 24px; 
            border-radius: 30px; 
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .audio-btn:hover { 
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(40,167,69,0.4);
        }
        
        /* ---- 中文翻译区块 ---- */
        .translation-block {
            background: #fff8f0;
            border-left: 6px solid #e74c3c;
            padding: 18px 22px;
            border-radius: 10px;
            margin-bottom: 20px;
            margin-top: 16px;
        }
        .chinese-trans {
            color: #e74c3c;
            font-size: 22px;
            font-weight: bold;
            line-height: 1.8;
        }
        
        /* ---- 英文释义区块（按词性分开） ---- */
        .definition-block {
            background: #f8f9fa;
            border-left: 6px solid #007bff;
            padding: 16px 22px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .def-pos {
            color: #007bff;
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 4px;
        }
        .def-text {
            color: #2c3e50;
            font-size: 17px;
            line-height: 1.8;
            margin: 0;
        }
        
        /* ---- 词形变化区块 ---- */
        .exchange-block {
            background: #f0f8ff;
            border-left: 6px solid #ffc107;
            padding: 16px 22px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .exchange-title {
            font-weight: bold;
            color: #856404;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .exchange-items {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 30px;
        }
        .exchange-item {
            font-size: 17px;
            color: #2c3e50;
        }
        .exchange-item .label {
            color: #888;
            font-weight: normal;
            font-size: 15px;
        }
        .exchange-item .value {
            font-weight: bold;
            color: #1a237e;
        }
        
        /* ---- 其他信息 ---- */
        .info-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
            color: #888;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }
        .info-row span {
            background: #f5f5f5;
            padding: 2px 12px;
            border-radius: 4px;
        }
        
        .count { 
            color: #28a745; 
            font-weight: bold; 
            background: #e8f5e9; 
            padding: 6px 16px; 
            border-radius: 30px; 
            display: inline-block;
            font-size: 14px;
            margin-top: 20px;
        }
        .error { 
            color: #721c24; 
            padding: 14px 20px; 
            background: #f8d7da; 
            border-radius: 10px;
            border-left: 5px solid #dc3545;
            font-size: 16px;
        }
        .loading {
            color: #007bff;
            text-align: center;
            padding: 30px;
            font-size: 18px;
        }
        .count-wrap {
            text-align: right;
        }
        .section-title {
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
            margin: 18px 0 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            📚 在线词典
            <span class="badge">完整版</span>
            <span class="badge badge-green">🔊 发音</span>
        </h1>
        
        <div class="search-box">
            <input type="text" id="wordInput" placeholder="输入英文单词，如 apple、run、abandon..." autofocus>
            <button onclick="searchWord()">🔍 查询</button>
        </div>

        <div id="result">
            <div id="wordDisplay"></div>
            <div id="audioDisplay"></div>
            <div id="meaningsDisplay"></div>
            <div id="countDisplay"></div>
        </div>
    </div>

    <script>
        async function searchWord() {
            const word = document.getElementById('wordInput').value.trim();
            if (!word) {
                alert('请输入单词');
                return;
            }
            
            document.getElementById('result').innerHTML = `<p class="loading">⏳ 正在查询 "${word}" ...</p>`;
            
            const res = await fetch(`/search?word=${word}`);
            const data = await res.json();
            
            if (data.error) {
                document.getElementById('result').innerHTML = `<p class="error">❌ ${data.error}</p>`;
                return;
            }

            let html = '';

            // ---- 1. 单词标题 + 音标 + 发音按钮 ----
            html += `<div class="word-title">`;
            html += `<h2>${data.word}</h2>`;
            if (data.phonetic) {
                html += `<span class="phonetic">/${data.phonetic}/</span>`;
            }
            if (data.audio) {
                html += `<button class="audio-btn" onclick="playAudio('${data.audio}')">🔊 发音</button>`;
            }
            html += `</div>`;

            // ---- 2. 中文翻译 ----
            html += `<div class="translation-block">`;
            html += `<div class="chinese-trans">🀄️ ${data.translation || '暂无翻译'}</div>`;
            html += `</div>`;

            // ---- 3. 英文释义（按词性换行展示，不显示 📌 n.） ----
            if (data.definitions && data.definitions.length > 0) {
                html += `<div class="section-title">📖 英文释义</div>`;
                data.definitions.forEach(def => {
                    html += `<div class="definition-block">`;
                    html += `<div class="def-pos">${def.pos}</div>`;
                    html += `<div class="def-text">${def.text}</div>`;
                    html += `</div>`;
                });
            }

            // ---- 4. 词形变化（中文标签） ----
            if (data.exchanges && data.exchanges.length > 0) {
                html += `<div class="section-title">🔄 词形变化</div>`;
                html += `<div class="exchange-block">`;
                html += `<div class="exchange-items">`;
                data.exchanges.forEach(ex => {
                    html += `<div class="exchange-item">`;
                    html += `<span class="label">${ex.label}：</span>`;
                    html += `<span class="value">${ex.value}</span>`;
                    html += `</div>`;
                });
                html += `</div>`;
                html += `</div>`;
            }

            // ---- 5. 其他信息 ----
            html += `<div class="info-row">`;
            if (data.collins) {
                html += `<span>柯林斯分级: ${data.collins}</span>`;
            }
            if (data.oxford) {
                html += `<span>牛津分级: ${data.oxford}</span>`;
            }
            html += `</div>`;

            // ---- 6. 搜索次数 ----
            html += `<div class="count-wrap">`;
            html += `<span class="count">📊 本词已被搜索 ${data.search_count} 次</span>`;
            html += `</div>`;

            document.getElementById('result').innerHTML = html;
        }

        function playAudio(url) {
            const audio = new Audio(url);
            audio.play().catch(function(e) {
                const word = document.querySelector('.word-title h2')?.textContent || '';
                if (word) {
                    const fallbackUrl = `https://dict.youdao.com/dictvoice?audio=${word}&type=1`;
                    const fallbackAudio = new Audio(fallbackUrl);
                    fallbackAudio.play().catch(function() {
                        alert('⚠️ 无法播放音频，请检查网络连接后重试。');
                    });
                } else {
                    alert('⚠️ 无法播放音频，请检查网络连接后重试。');
                }
            });
        }

        // 支持回车键
        document.getElementById('wordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchWord();
        });

        // 页面加载后自动聚焦输入框
        window.onload = function() {
            document.getElementById('wordInput').focus();
        };
    </script>
</body>
</html>
